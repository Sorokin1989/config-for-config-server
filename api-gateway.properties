logging.level.org.springframework.cloud.gateway=DEBUG

# Server
server.port=8080

# Actuator
management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=gateway,health,circuitbreakers
management.endpoint.health.show-details=always

# --- Circuit Breaker: пороги для активации notificationservice ---
resilience4j.circuitbreaker.instances.notificationServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.notificationServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notificationServiceCB.automatic-transition-from-open-to-half-open-enabled=true

# --- Circuit Breaker: пороги для активации userService---
resilience4j.circuitbreaker.instances.userServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.userServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.userServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userServiceCB.automatic-transition-from-open-to-half-open-enabled=true

# --- Gateway Routes ---
# Route 1: user-service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# Route 2: notification-service
spring.cloud.gateway.server.webflux.routes[1].id=notification-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/notifications/**

# Фильтр Circuit Breaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=userServiceCB
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/users
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.statusCodes[1]=500

# Фильтр Circuit Breaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=notificationServiceCB
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/notifications
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.statusCodes[0]=404
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.statusCodes[1]=500



# --- Eureka Client ---
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
